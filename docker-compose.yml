services:
  api:
    image: ghcr.io/saleor/saleor:3.23
    ports:
      - ${API_PORT:-8000}:8000
    restart: unless-stopped
    networks:
      - saleor-backend-tier
    stdin_open: true
    tty: true
    depends_on:
      - db
      - cache
      - jaeger
    volumes:
      # shared volume between worker and api for media
      - saleor-media:/app/media
      - ./custom-commands/populatedb_exlynatural.py:/app/saleor/core/management/commands/populatedb_exlynatural.py:ro
      - ./seed-assets:/app/seed-assets:ro
    env_file:
      - common.env
      - backend.env

  cache:
    image: valkey/valkey:8.1-alpine
    ports:
      - ${CACHE_PORT:-6379}:6379
    restart: unless-stopped
    networks:
      - saleor-backend-tier
    volumes:
      - saleor-cache:/data

  dashboard:
    image: lubshad/saleor-dashboard-exlynatural:latest-arm64
    ports:
      - ${DASHBOARD_PORT:-9000}:9000
    restart: unless-stopped

  db:
    image: library/postgres:15-alpine
    ports:
      - ${POSTGRES_PORT:-5432}:5432
    restart: unless-stopped
    networks:
      - saleor-backend-tier
    volumes:
      - saleor-db:/var/lib/postgresql/data
      - ./replica_user.sql:/docker-entrypoint-initdb.d/replica_user.sql:ro,z
    environment:
      - POSTGRES_USER=saleor
      - POSTGRES_PASSWORD=saleor

  worker:
    image: ghcr.io/saleor/saleor:3.23
    command: celery -A saleor --app=saleor.celeryconf:app worker --loglevel=info -B
    restart: unless-stopped
    networks:
      - saleor-backend-tier
    env_file:
      - common.env
      - backend.env
    depends_on:
      - cache
      - mailpit
    volumes:
      # shared volume between worker and api for media
      - saleor-media:/app/media

  jaeger:
    image: jaegertracing/jaeger
    ports:
      - "${JAEGER_UI_PORT:-16686}:16686"
      - "${JAEGER_OTLP_GRPC_PORT:-4317}:4317"
      - "${JAEGER_OTLP_HTTP_PORT:-4318}:4318"
    restart: unless-stopped
    networks:
      - saleor-backend-tier
    volumes:
      - type: tmpfs
        target: /tmp

  mailpit:
    image: axllent/mailpit
    ports:
      - ${MAILPIT_SMTP_PORT:-1025}:1025 # smtp server
      - ${MAILPIT_UI_PORT:-8025}:8025 # web ui. Visit http://localhost:${MAILPIT_UI_PORT:-8025}/ to check emails
    restart: unless-stopped
    networks:
      - saleor-backend-tier

volumes:
  saleor-db:
    driver: local
  saleor-cache:
    driver: local
  saleor-media:

networks:
  saleor-backend-tier:
    driver: bridge
